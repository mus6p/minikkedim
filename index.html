<style>
:root{--bg:#0B0B0F;--bg2:#111117;--card:#15151C;--card2:#1B1B24;--line:#24242E;--line2:#2E2E3A;--txt:#F3F3F5;--mut:#8B8B98;--mut2:#5F5F6C;--acc:#D4FF3A;--ink:#0B0B0F;--red:#FF5470;--r:18px;--disp:'Bricolage Grotesque',system-ui,sans-serif;--body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);transition:.15s;margin-left:auto}

.seg button.on{background:var(--card2);color:var(--txt)}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:1.5px dashed var(--line2);border-radius:18px;padding:40px 20px;cursor:pointer;color:var(--mut);transition:.15s;background:var(--card)}

.prev .cv{aspect-ratio:16/10}

.note{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:10px}
.note i{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.note i.w{background:#ffb84d}
.row{display:flex;gap:10px;margin-top:16px}
.row>*{flex:1}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li img{width:44px;height:44px;border-radius:12px;flex:none}
.li div{flex:1;min-width:0}
.li b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

.sm{height:34px;padding:0 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);font-weight:600;font-size:13px}

.prof{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.prof .av{width:64px;height:64px;font-size:26px}
.spin{width:20px;height:20px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();const t=a.dataset.act;if(t==='upload')uploadModal();else if(t==='login')authModal('in');else if(t==='me')meModal();else if(t==='about')aboutModal();return}
 const gh=e.target.closest('[data-go="home"]');if(gh){e.preventDefault();tab='all';query='';$('#q').value=$('#q2').value='';if(cur)go('');renderHome();window.scrollTo({top:0,behavior:'smooth'});return}
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;if(cur)go('');renderHome();if(tb.closest('nav'))document.querySelector('.sh').scrollIntoView({behavior:'smooth',block:'start'})}});
const onQ=v=>{query=v.trim();if(cur)go('');renderHome()};$('#q').oninput=e=>onQ(e.target.value);$('#q2').oninput=e=>onQ(e.target.value);
$('#msbtn').onclick=()=>{const m=$('#msearch');m.classList.toggle('on');if(m.classList.contains('on'))$('#q2').focus()};
$('#yr').textContent=new Date().getFullYear();
(async()=>{try{await api.init()}catch(e){}renderAuth();await load();route()})();
</script>
</body>
</html>
