<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMO=['🎮','🐱','🐶','🍬','🧩','🚀','⭐','👾','🏎️','⚽','🎨','🧁','🐸','🦄','🌈','💎','🔥','🎯','🐟','🍓','🎲','🏰','🐼','🎵'];
const COL=['#ff7fb0','#ff9a6b','#ffd166','#7ed99a','#5bc8ff','#8b7bff','#c77dff','#ff5c7a','#2e2b44','#ffffff'];
const MAXF=5*1024*1024;
let ADM=false,me=null,games=[],filter='all',query='',cur=null;
/* ================== VERİ KATMANI ================== */
const DEMO=!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY||!window.supabase;
const uname=u=>u?(u.user_metadata&&u.user_metadata.username)||(u.email||'').split('@')[0]:'';
const isAdmin=()=>!!me&&(ADM||(!!CONFIG.ADMIN_EMAIL&&!!me.email&&me.email.toLowerCase()===CONFIG.ADMIN_EMAIL.toLowerCase()));
const canEdit=gm=>!!me&&(gm.owner===me.id||isAdmin()||DEMO);
let api;
if(!DEMO){
 const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 const tr=e=>{const m=(e&&e.message)||String(e);if(/Invalid login/i.test(m))return'E-posta ya da şifre yanlış.';if(/Email not confirmed/i.test(m))return'Önce e-postana gelen onay bağlantısına tıkla.';if(/already registered/i.test(m))return'Bu e-posta zaten kayıtlı, giriş yap.';if(/Password should/i.test(m))return'Şifre en az 6 karakter olmalı.';if(/rate limit/i.test(m))return'Çok fazla deneme oldu, biraz bekle.';return m};
 api={
  async init(){const chk=()=>{ADM=false;if(me)sb.rpc('is_admin').then(r=>{ADM=!!r.data;renderMe()},()=>{})};const{data}=await sb.auth.getSession();me=data.session?data.session.user:null;chk();sb.auth.onAuthStateChange((_e,s)=>{const was=me&&me.id;me=s?s.user:null;if((me&&me.id)!==was)chk();renderMe();render()})},
  async list(){const{data,error}=await sb.from('games').select('*').order('created_at',{ascending:false});if(error)throw new Error(tr(error));return data||[]},
  async signUp(email,pw,username){const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});if(error)throw new Error(tr(error));return!data.session},
  async signIn(email,pw){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw new Error(tr(error))},
  async signOut(){await sb.auth.signOut()},
  async create(f,file){const path=me.id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36))+'.html';
   const up=await sb.storage.from('games').upload(path,file,{contentType:'text/plain;charset=utf-8',upsert:false});if(up.error)throw new Error(tr(up.error));
   const{error}=await sb.from('games').insert({title:f.title,description:f.description,icon:f.icon,color:f.color,path,author:uname(me)});if(error){await sb.storage.from('games').remove([path]);throw new Error(tr(error))}},
  async update(gm,f,file){if(file){const up=await sb.storage.from('games').upload(gm.path,file,{contentType:'text/plain;charset=utf-8',upsert:true});if(up.error)throw new Error(tr(up.error))}
   const{error}=await sb.from('games').update({title:f.title,description:f.description,icon:f.icon,color:f.color,updated_at:new Date().toISOString()}).eq('id',gm.id);if(error)throw new Error(tr(error))},
  async remove(gm){const{error}=await sb.from('games').delete().eq('id',gm.id);if(error)throw new Error(tr(error));await sb.storage.from('games').remove([gm.path])},
  async html(gm){const u=sb.storage.from('games').getPublicUrl(gm.path).data.publicUrl+'?v='+encodeURIComponent(gm.updated_at||'');const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error('Oyun dosyası açılamadı ('+r.status+')');return r.text()},
  play(id){sb.rpc('play',{gid:id}).then(()=>{},()=>{})}
 };
}else{
 const K='zyne_demo',ld=()=>{try{return JSON.parse(localStorage.getItem(K))||{games:[],users:[],me:null}}catch(e){return{games:[],users:[],me:null}}},sv=d=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){throw new Error('Cihazda yer kalmadı (deneme modu).')}};
 const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
 api={
  async init(){const d=ld();me=d.me},
  async list(){return ld().games.map(g=>Object.assign({},g,{html:undefined}))},
  async signUp(email,pw,username){const d=ld();if(d.users.find(u=>u.email===email))throw new Error('Bu e-posta zaten kayıtlı, giriş yap.');if(pw.length<6)throw new Error('Şifre en az 6 karakter olmalı.');const u={id:'u'+Date.now(),email,pw,user_metadata:{username}};d.users.push(u);d.me={id:u.id,email,user_metadata:u.user_metadata};sv(d);me=d.me;return false},
  async signIn(email,pw){const d=ld(),u=d.users.find(u=>u.email===email&&u.pw===pw);if(!u)throw new Error('E-posta ya da şifre yanlış.');d.me={id:u.id,email,user_metadata:u.user_metadata};sv(d);me=d.me},
  async signOut(){const d=ld();d.me=null;sv(d);me=null},
  async create(f,file){const d=ld(),h=await rd(file);d.games.unshift({id:'g'+Date.now(),owner:me.id,author:uname(me),title:f.title,description:f.description,icon:f.icon,color:f.color,path:'demo',plays:0,created_at:new Date().toISOString(),updated_at:new Date().toISOString(),html:h});sv(d)},
  async update(gm,f,file){const d=ld(),g=d.games.find(x=>x.id===gm.id);if(!g)return;Object.assign(g,{title:f.title,description:f.description,icon:f.icon,color:f.color,updated_at:new Date().toISOString()});if(file)g.html=await rd(file);sv(d)},
  async remove(gm){const d=ld();d.games=d.games.filter(x=>x.id!==gm.id);sv(d)},
  async html(gm){const g=ld().games.find(x=>x.id===gm.id);if(!g)throw new Error('Oyun bulunamadı');return g.html},
  play(id){const d=ld(),g=d.games.find(x=>x.id===id);if(g){g.plays=(g.plays||0)+1;sv(d)}}
 };
}
/* ================== ARAYÜZ ================== */
const toast=(t,ms)=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms||2400)};
const icHTML=(gm,cls)=>{const ic=gm.icon||'🎮',img=/^data:image\//.test(ic);return`<div class="ic ${cls||''}" style="background:${img?'#fff':`linear-gradient(145deg,${esc(gm.color||'#ff7fb0')},${shade(gm.color||'#ff7fb0',-28)})`}">${img?`<img src="${esc(ic)}" alt="">`:esc(ic)}</div>`};
function shade(h,p){try{let n=parseInt(String(h).slice(1),16),r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}catch(e){return h}}
function tick(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');const h=d.getHours();$('#hello').textContent=(h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar')+(me?', '+uname(me):'')+' 👋'}
setInterval(tick,15000);
function renderMe(){$('#melb').textContent=me?uname(me).slice(0,10):'Giriş';$('#meic').textContent=me?(uname(me)[0]||'🙂').toLocaleUpperCase('tr'):'👤';tick()}
function render(){
 $('#banner').innerHTML=DEMO?'<div class="banner">🧪 <b>Deneme modu:</b> Supabase henüz bağlı değil. Yüklediğin oyunlar sadece bu cihazda saklanır.</div>':'';
 const chips=[['all','Tümü'],['new','Yeni'],['top','Popüler']].concat(me?[['mine','Benimkiler']]:[]);
 $('#chips').innerHTML=chips.map(c=>`<button class="chip ${filter===c[0]?'on':''}" data-f="${c[0]}">${c[1]}</button>`).join('');
 let l=games.slice();if(query){const q=query.toLocaleLowerCase('tr');l=l.filter(g=>(g.title+' '+(g.author||'')+' '+(g.description||'')).toLocaleLowerCase('tr').includes(q))}
 if(filter==='top')l.sort((a,b)=>(b.plays||0)-(a.plays||0));if(filter==='mine'&&me)l=l.filter(g=>g.owner===me.id);if(filter==='new')l=l.filter(g=>Date.now()-new Date(g.created_at)<7*864e5);
 if(!games.length){$('#list').innerHTML=`<div class="empty"><b>Henüz oyun yok</b>İlk oyunu sen yükle! Aşağıdaki <b style="display:inline;font-size:inherit">➕ Yükle</b>'ye dokun.</div>`;return}
 if(!l.length){$('#list').innerHTML='<div class="empty"><b>Bulunamadı</b>Başka bir şey ara.</div>';return}
 $('#list').innerHTML='<div class="grid">'+l.map((g,i)=>`<div class="app" data-id="${esc(g.id)}" style="animation-delay:${Math.min(i,20)*25}ms"><div class="icw">${Date.now()-new Date(g.created_at)<2*864e5?'<span class="new">YENİ</span>':''}${icHTML(g)}</div><div class="nm">${esc(g.title)}</div></div>`).join('')+'</div>';
}
async function load(){try{games=await api.list()}catch(e){toast('Oyunlar yüklenemedi: '+e.message,4000)}render()}
/* sheet */
function openSheet(html,after){$('#sb').innerHTML=html;$('#sb').scrollTop=0;$('#sheet').classList.add('on');$('#veil').classList.add('on');if(after)after()}
function closeSheet(){$('#sheet').classList.remove('on');$('#veil').classList.remove('on');document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}
$('#veil').onclick=closeSheet;
{let sy=null;const s=$('#sheet');s.addEventListener('touchstart',e=>{if($('#sb').scrollTop<=0)sy=e.touches[0].clientY},{passive:true});s.addEventListener('touchmove',e=>{if(sy!=null&&e.touches[0].clientY-sy>90){sy=null;closeSheet()}},{passive:true});s.addEventListener('touchend',()=>sy=null)}
/* giriş / kayıt */
function authSheet(mode,then){mode=mode||'in';
 openSheet(`<h2>${mode==='in'?'Tekrar hoş geldin':'Üye ol'}</h2><p class="s">Oynamak için üyelik gerekmez. Oyun yüklemek için giriş yapman lazım.</p>
 <div class="tabs"><button class="${mode==='in'?'on':''}" data-t="in">Giriş yap</button><button class="${mode==='up'?'on':''}" data-t="up">Üye ol</button></div>
 <form id="af">${mode==='up'?'<label class="f">Kullanıcı adı</label><input class="in" id="au" maxlength="20" required autocomplete="nickname" placeholder="örn. oyuncu34">':''}
 <label class="f">E-posta</label><input class="in" id="ae" type="email" required autocomplete="email" placeholder="ornek@mail.com">
 <label class="f">Şifre</label><input class="in" id="ap" type="password" required minlength="6" autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="en az 6 karakter">
 <div class="err" id="aerr"></div><button class="btn" id="ab">${mode==='in'?'Giriş yap':'Hesap oluştur'}</button></form>`,()=>{
  $('#sb').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>authSheet(b.dataset.t,then));
  $('#af').onsubmit=async e=>{e.preventDefault();const b=$('#ab');b.disabled=true;b.innerHTML='<span class="spin"></span>';$('#aerr').textContent='';
   try{const em=$('#ae').value.trim(),pw=$('#ap').value;
    if(mode==='up'){const u=$('#au').value.trim();if(u.length<2)throw new Error('Kullanıcı adı en az 2 karakter olmalı.');const needConfirm=await api.signUp(em,pw,u);
     if(needConfirm){openSheet(`<h2>📬 E-postana bak</h2><p class="s"><b>${esc(em)}</b> adresine bir onay bağlantısı gönderdik. Bağlantıya tıkladıktan sonra buraya dönüp giriş yapabilirsin.</p><button class="btn" id="ok">Tamam</button>`,()=>$('#ok').onclick=()=>authSheet('in',then));return}}
    else await api.signIn(em,pw);
    renderMe();render();toast('Hoş geldin, '+uname(me)+'!');closeSheet();if(then)setTimeout(then,350)}
   catch(err){$('#aerr').textContent=err.message;b.disabled=false;b.textContent=mode==='in'?'Giriş yap':'Hesap oluştur'}}})}
/* profil */
function meSheet(){if(!me)return authSheet('in');
 const mine=games.filter(g=>g.owner===me.id),plays=mine.reduce((a,g)=>a+(g.plays||0),0);
 openSheet(`<div class="info"><div class="ic" style="background:linear-gradient(145deg,#ffe08a,#ffad5a);border-radius:50%">${esc((uname(me)[0]||'?').toLocaleUpperCase('tr'))}</div><div><h2 style="margin:0">${esc(uname(me))}</h2><div class="meta">${esc(me.email||'')}${isAdmin()?' · 👑 Yönetici':''}</div><div class="meta">${mine.length} oyun · ${plays} oynanma</div></div></div>
 <button class="btn" id="m1">🎮 Oyunlarımı yönet</button><button class="btn ghost" id="m2">➕ Yeni oyun yükle</button><button class="btn red" id="m3">Çıkış yap</button>`,()=>{
  $('#m1').onclick=mineSheet;$('#m2').onclick=()=>uploadSheet();$('#m3').onclick=async()=>{await api.signOut();me=null;renderMe();filter='all';render();closeSheet();toast('Çıkış yapıldı')}})}
function mineSheet(){if(!me)return authSheet('in',mineSheet);
 const list=isAdmin()?games:games.filter(g=>g.owner===me.id);
 openSheet(`<h2>${isAdmin()?'Tüm oyunlar 👑':'Oyunlarım'}</h2><p class="s">${isAdmin()?'Yönetici olarak her oyunu düzenleyip silebilirsin.':'Yüklediğin oyunları buradan düzenleyebilir ya da silebilirsin.'}</p>
 ${list.length?list.map(g=>`<div class="mine">${icHTML(g)}<div class="t"><b>${esc(g.title)}</b><small>${esc(g.author||'')} · ${g.plays||0} oynanma</small></div><button class="sm" data-e="${esc(g.id)}">Düzenle</button><button class="sm red" data-d="${esc(g.id)}">Sil</button></div>`).join(''):'<div class="empty" style="background:#efe8fa;color:var(--muted)"><b style="color:var(--ink)">Henüz oyunun yok</b>İlk oyununu yükle!</div>'}
 <button class="btn" id="mu">➕ Yeni oyun yükle</button>`,()=>{
  $('#mu').onclick=()=>uploadSheet();
  $('#sb').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>uploadSheet(games.find(g=>g.id===b.dataset.e)));
  $('#sb').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delSheet(games.find(g=>g.id===b.dataset.d),mineSheet))})}
function delSheet(gm,back){if(!gm)return;openSheet(`<div class="info">${icHTML(gm)}<div><h2 style="margin:0">${esc(gm.title)}</h2><div class="meta">Bu oyun kalıcı olarak silinecek.</div></div></div><p class="s">Emin misin? Bu işlem geri alınamaz.</p><div class="row"><button class="btn ghost" id="dn">Vazgeç</button><button class="btn red" id="dy">Evet, sil</button></div>`,()=>{
 $('#dn').onclick=back||closeSheet;$('#dy').onclick=async()=>{$('#dy').disabled=true;try{await api.remove(gm);toast('Oyun silindi');await load();(back||closeSheet)()}catch(e){toast(e.message,4000);$('#dy').disabled=false}}})}
/* yükle / düzenle */
function uploadSheet(gm){if(!me)return authSheet('in',()=>uploadSheet(gm));
 const st={icon:gm?gm.icon:'🎮',color:gm?gm.color:COL[Math.random()*6|0],file:null};
 openSheet(`<h2>${gm?'Oyunu düzenle':'Oyun yükle'}</h2><p class="s">${gm?'Bilgileri değiştir. Yeni bir HTML seçersen oyun güncellenir.':'Kendi yaptığın tek dosyalık bir HTML oyununu seç. Yükledikten sonra herkes oynayabilir.'}</p>
 <label class="f">HTML dosyası ${gm?'(isteğe bağlı)':''}</label><label class="drop" id="dz"><input type="file" id="uf" accept=".html,.htm,text/html" hidden><b id="fn">${gm?'Dosyayı değiştirmek için dokun':'Dosya seçmek için dokun'}</b><br><small>.html · en fazla 5 MB</small></label>
 <label class="f">Oyun adı</label><input class="in" id="ut" maxlength="40" value="${esc(gm?gm.title:'')}" placeholder="örn. Minik Kedim">
 <label class="f">Kısa açıklama</label><textarea class="in" id="ud" maxlength="300" placeholder="Oyun ne hakkında?">${esc(gm?gm.description:'')}</textarea>
 <label class="f">Simge</label><div class="emojis" id="ue">${EMO.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('')}</div>
 <div class="swatches" id="uc">${COL.map(c=>`<button type="button" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
 <div class="row" style="margin-top:10px"><label class="sm" style="display:inline-block">🖼️ Resim seç<input type="file" id="ui" accept="image/*" hidden></label></div>
 <div class="pv" id="pv"></div>
 <div class="err" id="uerr"></div><button class="btn" id="ub">${gm?'Kaydet':'Yükle ve yayınla'}</button>
 ${gm?'<button class="btn red" id="udel">Oyunu sil</button>':''}`,()=>{
  const pv=()=>{$('#pv').innerHTML=icHTML({icon:st.icon,color:st.color})+`<div><b>${esc($('#ut').value||'Oyun adı')}</b><div class="meta">${esc(uname(me))}</div></div>`;
   $('#ue').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.e===st.icon));$('#uc').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===st.color))};
  pv();$('#ut').oninput=pv;
  $('#ue').onclick=e=>{const b=e.target.closest('[data-e]');if(b){st.icon=b.dataset.e;pv()}};
  $('#uc').onclick=e=>{const b=e.target.closest('[data-c]');if(b){st.color=b.dataset.c;if(/^data:/.test(st.icon))st.icon='🎮';pv()}};
  $('#uf').onchange=async()=>{const f=$('#uf').files[0];if(!f)return;if(f.size>MAXF){$('#uerr').textContent='Dosya 5 MB\'tan büyük.';return}
   const t=await f.text();if(!/<(html|script|canvas|body|div)/i.test(t)){$('#uerr').textContent='Bu bir HTML oyun dosyası gibi görünmüyor.';return}
   st.file=f;$('#uerr').textContent='';$('#fn').textContent='✅ '+f.name;if(!$('#ut').value){const m=t.match(/<title[^>]*>([^<]{1,40})/i);$('#ut').value=(m?m[1]:f.name.replace(/\.html?$/i,'')).trim().slice(0,40);pv()}};
  $('#ui').onchange=()=>{const f=$('#ui').files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);st.icon=c.toDataURL('image/jpeg',.85);pv();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
  if(gm)$('#udel').onclick=()=>delSheet(gm,()=>mineSheet());
  $('#ub').onclick=async()=>{const title=$('#ut').value.trim(),description=$('#ud').value.trim();
   if(!gm&&!st.file){$('#uerr').textContent='Bir HTML dosyası seç.';return}if(!title){$('#uerr').textContent='Oyuna bir ad ver.';return}
   const b=$('#ub');b.disabled=true;b.innerHTML='<span class="spin"></span> '+(gm?'Kaydediliyor':'Yükleniyor');
   try{const f={title,description,icon:st.icon,color:st.color};if(gm)await api.update(gm,f,st.file);else await api.create(f,st.file);
    await load();closeSheet();toast(gm?'Kaydedildi ✨':'Oyunun yayında! 🎉')}catch(e){$('#uerr').textContent=e.message;b.disabled=false;b.textContent=gm?'Kaydet':'Yükle ve yayınla'}}})}
/* oyun bilgisi (basılı tut) */
function infoSheet(gm){openSheet(`<div class="info">${icHTML(gm)}<div><h2 style="margin:0">${esc(gm.title)}</h2><div class="meta">👤 ${esc(gm.author||'?')} · ▶ ${gm.plays||0} oynanma</div><div class="meta">${new Date(gm.created_at).toLocaleDateString('tr-TR')}</div></div></div>
 ${gm.description?`<p class="s">${esc(gm.description)}</p>`:''}<button class="btn" id="ip">▶ Oyna</button><button class="btn ghost" id="is">🔗 Bağlantıyı kopyala</button>
 ${canEdit(gm)?'<div class="row"><button class="btn ghost" id="ie">Düzenle</button><button class="btn red" id="id">Sil</button></div>':''}`,()=>{
 $('#ip').onclick=()=>{closeSheet();setTimeout(()=>openGame(gm),200)};$('#is').onclick=()=>share(gm);
 if(canEdit(gm)){$('#ie').onclick=()=>uploadSheet(gm);$('#id').onclick=()=>delSheet(gm)}})}
function share(gm){const u=location.origin+location.pathname+'#oyun-'+gm.id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Bağlantı kopyalandı'),()=>prompt('Bağlantı:',u))}
/* ================== OYUN AÇMA ================== */
const SKEY=id=>'zg_'+id;
function shim(id){let d={};try{d=JSON.parse(localStorage.getItem(SKEY(id)))||{}}catch(e){}
 return '<script>(function(){var D='+JSON.stringify(d).replace(/</g,'\\u003c')+',K='+JSON.stringify(id)+';function P(){try{parent.postMessage({zs:1,k:K,d:D},"*")}catch(e){}}var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);P()},removeItem:function(k){delete D[k];P()},clear:function(){D={};P()},key:function(i){return Object.keys(D)[i]||null}};Object.defineProperty(S,"length",{get:function(){return Object.keys(D).length}});try{Object.defineProperty(window,"localStorage",{value:S,configurable:true})}catch(e){}var M={};try{Object.defineProperty(window,"sessionStorage",{value:{getItem:function(k){return M[k]||null},setItem:function(k,v){M[k]=String(v)},removeItem:function(k){delete M[k]},clear:function(){M={}}},configurable:true})}catch(e){}})();<\/script>'}
function inject(html,id){const s=shim(id);if(/<head[^>]*>/i.test(html))return html.replace(/<head[^>]*>/i,m=>m+s);if(/<html[^>]*>/i.test(html))return html.replace(/<html[^>]*>/i,m=>m+s);return s+html}
window.addEventListener('message',e=>{const d=e.data;if(!d||!d.zs||!cur)return;const fr=$('#app iframe');if(!fr||e.source!==fr.contentWindow||d.k!==cur.id)return;try{const s=JSON.stringify(d.d);if(s.length<3e6)localStorage.setItem(SKEY(d.k),s)}catch(err){}});
async function openGame(gm){if(!gm)return;cur=gm;const a=$('#app');$('#fmenu').style.display='none';
 $('#splash').innerHTML=icHTML(gm)+`<b style="font-size:20px">${esc(gm.title)}</b><span class="spin"></span>`;$('#splash').style.opacity=1;$('#splash').style.display='flex';
 a.querySelectorAll('iframe').forEach(f=>f.remove());a.classList.add('on');history.replaceState(null,'','#oyun-'+gm.id);
 try{const h=await api.html(gm);if(cur!==gm)return;const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-pointer-lock allow-popups allow-forms allow-modals');f.setAttribute('allow','fullscreen; autoplay; gamepad; accelerometer; gyroscope');f.setAttribute('title',gm.title);f.srcdoc=inject(h,gm.id);
  f.onload=()=>{setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').style.display='none',300)},350);try{f.focus()}catch(e){}};a.insertBefore(f,a.firstChild);api.play(gm.id);gm.plays=(gm.plays||0)+1}
 catch(e){$('#splash').innerHTML=icHTML(gm)+`<b>Oyun açılamadı</b><small style="opacity:.7;max-width:80%;text-align:center">${esc(e.message)}</small><button class="btn" style="width:auto;padding:12px 24px" onclick="closeGame()">Geri dön</button>`}}
function closeGame(){const a=$('#app');a.classList.remove('on');cur=null;history.replaceState(null,'',location.pathname);setTimeout(()=>{if(!cur)a.querySelectorAll('iframe').forEach(f=>f.remove())},400);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
/* yüzen buton */
{const fab=$('#fab'),menu=$('#fmenu');let sx,sy,ox,oy,mv=false,down=false;
 fab.addEventListener('pointerdown',e=>{down=true;mv=false;sx=e.clientX;sy=e.clientY;const r=fab.getBoundingClientRect(),p=$('#phone').getBoundingClientRect();ox=r.left-p.left;oy=r.top-p.top;fab.setPointerCapture(e.pointerId);fab.style.opacity=1});
 fab.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)mv=true;if(mv){const p=$('#phone').getBoundingClientRect();fab.style.left=Math.max(4,Math.min(p.width-52,ox+dx))+'px';fab.style.top=Math.max(4,Math.min(p.height-52,oy+dy))+'px';fab.style.right='auto';menu.style.display='none'}});
 fab.addEventListener('pointerup',()=>{down=false;fab.style.opacity=.75;const p=$('#phone').getBoundingClientRect(),r=fab.getBoundingClientRect();if(mv){const left=r.left-p.left<p.width/2;fab.style.left=(left?8:p.width-56)+'px';return}
  if(menu.style.display==='block'){menu.style.display='none';return}menu.style.display='block';const mw=menu.offsetWidth,mh=menu.offsetHeight;let x=r.left-p.left,y=r.top-p.top;menu.style.left=Math.max(8,Math.min(p.width-mw-8,x<p.width/2?x+56:x-mw-8))+'px';menu.style.top=Math.max(8,Math.min(p.height-mh-8,y-mh/2+24))+'px'});
 menu.onclick=e=>{const m=e.target.dataset.m;menu.style.display='none';if(m==='close')closeGame();else if(m==='reload'&&cur)openGame(cur);else if(m==='full'){const el=$('#phone');(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>toast('Tam ekran bu cihazda desteklenmiyor. Ana ekrana eklersen tam ekran açılır.',3500))}else if(m==='share'&&cur)share(cur)}}
/* ana ekran etkileşimleri */
$('#list').addEventListener('click',e=>{const a=e.target.closest('.app');if(!a||a._lp)return;openGame(games.find(g=>g.id===a.dataset.id))});
{let t=null;$('#list').addEventListener('pointerdown',e=>{const a=e.target.closest('.app');if(!a)return;a._lp=false;t=setTimeout(()=>{a._lp=true;if(navigator.vibrate)navigator.vibrate(15);infoSheet(games.find(g=>g.id===a.dataset.id))},520)});['pointerup','pointerleave','pointercancel','pointermove'].forEach(n=>$('#list').addEventListener(n,e=>{if(n==='pointermove'&&Math.abs(e.movementX)+Math.abs(e.movementY)<4)return;clearTimeout(t)}));
 $('#list').addEventListener('contextmenu',e=>{const a=e.target.closest('.app');if(a){e.preventDefault();a._lp=true;clearTimeout(t);infoSheet(games.find(g=>g.id===a.dataset.id))}})}
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}};
$('#q').oninput=e=>{query=e.target.value.trim();render()};
$('#dock').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='home'){closeSheet();filter='all';$('#q').value='';query='';render();$('#home').scrollTo({top:0,behavior:'smooth'})}else if(a==='upload')uploadSheet();else if(a==='mine')mineSheet();else meSheet()};
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#oyun-(.+)$/);if(m&&(!cur||cur.id!==m[1]))openGame(games.find(g=>g.id===m[1]));else if(!m&&cur)closeGame()});
(async()=>{try{await api.init()}catch(e){}renderMe();await load();const m=location.hash.match(/^#oyun-(.+)$/);if(m){const g=games.find(x=>x.id===m[1]);if(g)openGame(g);else toast('Bu oyun bulunamadı',3000)}})();
</script>
